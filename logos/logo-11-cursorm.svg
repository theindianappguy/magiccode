<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" shape-rendering="geometricPrecision">
  <title>magiccode monogram - cursor m: a stencil m whose centre stroke is a block cursor grown taller than the letter, overshooting it top and bottom. The cursor is not inside the m; the m is threaded onto the cursor.</title>
  <rect x="0" y="0" width="240" height="240" fill="#07070a"/>
  <rect x="40" y="44" width="67" height="28" fill="#ececf3"/>
  <rect x="133" y="44" width="67" height="28" fill="#ececf3"/>
  <rect x="40" y="72" width="26" height="124" fill="#ececf3"/>
  <rect x="174" y="72" width="26" height="124" fill="#ececf3"/>
  <rect x="107" y="20" width="26" height="200" fill="#ff9500"/>
</svg>
