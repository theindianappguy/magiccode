<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>magiccode — the diff: a stack of code lines cut open by a hard amber slash</title>

  <rect x="0" y="0" width="240" height="240" fill="#07070a"/>

  <!-- the code: five lines, ragged lengths, one indented -->
  <rect x="40"  y="40"  width="160" height="24" fill="#ececf3"/>
  <rect x="56"  y="74"  width="128" height="24" fill="#8b8b9e"/>
  <rect x="40"  y="108" width="160" height="24" fill="#ececf3"/>
  <rect x="40"  y="142" width="128" height="24" fill="#8b8b9e"/>
  <rect x="112" y="176" width="88"  height="24" fill="#ececf3"/>

  <!-- hard-edged cut through the stack -->
  <polygon points="130,25 180,25 92,215 42,215" fill="#07070a"/>

  <!-- the change itself -->
  <polygon points="132,40 164,40 90,200 58,200" fill="#ff9500"/>
</svg>
